name: Deploy OhPin backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ohpin-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ohpin-be

jobs:
  test-build-deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Build production image
        run: |
          docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip -1 > ohpin-be-image.tar.gz

      - name: Prepare production environment file
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$PRODUCTION_ENV_FILE" > .env.prod.raw

          awk -F= '
            BEGIN {
              allowed["SPRING_PROFILES_ACTIVE"] = 1
              allowed["SUPABASE_URL"] = 1
              allowed["SUPABASE_PUBLIC_URL"] = 1
              allowed["SUPABASE_PUBLISHABLE_KEY"] = 1
              allowed["ALLOWED_ORIGINS"] = 1
              allowed["PORT"] = 1
              allowed["API_BIND_ADDRESS"] = 1
              allowed["API_PORT"] = 1
              allowed["CONVERSION_MAX_CONCURRENT"] = 1
            }
            {
              sub(/\r$/, "")
              if (allowed[$1]) print
            }
          ' .env.prod.raw > .env.prod
          rm -f .env.prod.raw

          required_keys='SPRING_PROFILES_ACTIVE SUPABASE_URL SUPABASE_PUBLISHABLE_KEY ALLOWED_ORIGINS PORT API_BIND_ADDRESS API_PORT CONVERSION_MAX_CONCURRENT'
          for key in $required_keys; do
            if ! grep -q "^${key}=." .env.prod; then
              echo "Missing required key in ENV_FILE: ${key}" >&2
              exit 1
            fi
          done

          grep -Fxq 'SPRING_PROFILES_ACTIVE=prod' .env.prod
          grep -Fxq 'API_BIND_ADDRESS=127.0.0.1' .env.prod
          grep -Eq '^API_PORT=[0-9]+$' .env.prod
          grep -Eq '^SUPABASE_URL=https://[^[:space:]]+$' .env.prod
          grep -Eq '^SUPABASE_PUBLISHABLE_KEY=sb_publishable_.+$' .env.prod

          if grep -Eq '=\[https?://|&#x[0-9A-Fa-f]+;' .env.prod; then
            echo 'ENV_FILE contains Markdown-formatted values. Use raw URLs and values.' >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ohpin-deploy-key"
          chmod 600 "$HOME/.ssh/ohpin-deploy-key"
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -Eeuo pipefail
          deploy_dir="/home/${EC2_USER}/ohpin-be"
          remote="${EC2_USER}@${EC2_HOST}"
          ssh -i "$HOME/.ssh/ohpin-deploy-key" "$remote" "mkdir -p '$deploy_dir' && chmod 700 '$deploy_dir'"
          scp -i "$HOME/.ssh/ohpin-deploy-key" \
            compose.yml .env.prod ohpin-be-image.tar.gz scripts/deploy-production.sh \
            "${remote}:${deploy_dir}/"
          ssh -i "$HOME/.ssh/ohpin-deploy-key" "$remote" "chmod 600 '$deploy_dir/.env.prod'"

      - name: Activate release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -Eeuo pipefail
          deploy_dir="/home/${EC2_USER}/ohpin-be"
          remote="${EC2_USER}@${EC2_HOST}"
          ssh -i "$HOME/.ssh/ohpin-deploy-key" "$remote" \
            "IMAGE_TAG='$GITHUB_SHA' bash '$deploy_dir/deploy-production.sh'"
