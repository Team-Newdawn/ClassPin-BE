name: Chore
description: 설정, 문서, 의존성 등 유지보수 작업을 등록합니다.
title: "[Chore] "
labels:
  - chore
body:
  - type: markdown
    attributes:
      value: 모든 항목은 선택 사항입니다. 필요한 내용만 작성해주세요.
  - type: textarea
    id: details
    attributes:
      label: 작업 내용
      description: 변경할 설정, 문서, 의존성 또는 운영 작업을 작성해주세요.
  - type: textarea
    id: reason
    attributes:
      label: 작업 이유
      description: 이 작업이 필요한 이유가 있다면 작성해주세요.
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 링크나 주의할 점이 있다면 작성해주세요.
