name: 기능 제안
description: 새로운 기능이나 개선 아이디어를 자유롭게 제안해주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 모든 항목은 선택 사항입니다. 아이디어가 정리되지 않아도 괜찮습니다.
  - type: textarea
    id: problem
    attributes:
      label: 배경 또는 불편한 점
      description: 어떤 상황을 개선하고 싶은지 작성해주세요.
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 기능이나 동작을 자유롭게 작성해주세요.
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 방법
      description: 다른 방법을 고려했다면 작성해주세요.
  - type: textarea
    id: additional
    attributes:
      label: 추가 내용
      description: 참고 자료, 화면 예시, 관련 링크 등이 있다면 작성해주세요.
