name: 버그 제보
description: 발견한 문제를 자유롭게 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 모든 항목은 선택 사항입니다. 알고 있는 내용만 작성해주세요.
  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 작성해주세요.
      placeholder: 문제가 발생한 상황을 자유롭게 작성해주세요.
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 순서가 있다면 작성해주세요.
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      description: 원래 기대했던 동작을 작성해주세요.
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브라우저, 운영체제, 배포 환경 등 관련 정보가 있다면 작성해주세요.
  - type: textarea
    id: additional
    attributes:
      label: 추가 내용
      description: 로그, 화면 캡처, 관련 링크 등 참고할 내용을 작성해주세요.
