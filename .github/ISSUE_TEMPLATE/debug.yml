name: Debug
description: 오류나 예상과 다른 동작을 등록합니다.
title: "[Debug] "
labels:
  - debug
body:
  - type: markdown
    attributes:
      value: 모든 항목은 선택 사항입니다. 확인한 내용만 작성해주세요.
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 발생한 오류나 예상과 다른 동작을 작성해주세요.
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있는 순서가 있다면 작성해주세요.
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 브라우저, 운영체제, 배포 환경 등 관련 정보를 작성해주세요.
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 로그, 화면 캡처, 관련 링크 등이 있다면 작성해주세요.
