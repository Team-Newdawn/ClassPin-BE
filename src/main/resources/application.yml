spring:
  application:
    name: OhPin-BE
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 3600000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
ohpin:
  supabase:
    url: ${SUPABASE_URL}
    public-url: ${SUPABASE_PUBLIC_URL:${SUPABASE_URL}}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
  allowed-origins: ${ALLOWED_ORIGINS}
  conversion:
    max-concurrent: ${CONVERSION_MAX_CONCURRENT:2}
    soffice: ${SOFFICE_BINARY:soffice}
    pdfinfo: ${PDFINFO_BINARY:pdfinfo}
    pdftoppm: ${PDFTOPPM_BINARY:pdftoppm}
