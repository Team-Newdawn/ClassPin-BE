services:
  api:
    image: ohpin-be:latest
    container_name: ohpin-be
    pull_policy: never
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8082}:8080"
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=3g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
