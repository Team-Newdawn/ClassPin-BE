groups:
  - name: ohpin-backend
    rules:
      - alert: OhPinBackendMetricsUnavailable
        expr: up{job="ohpin-be"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: OhPin BE metrics endpoint is unavailable
          description: Prometheus cannot scrape the backend management endpoint.

      - alert: OhPinHighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="ohpin-be",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{job="ohpin-be"}[5m])), 0.01) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OhPin BE 5xx rate is above 5%
          description: More than 5% of backend requests have returned 5xx for five minutes.

      - alert: OhPinSlowServerRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="ohpin-be",uri=~"/api/.*"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: OhPin BE API p95 latency is above two seconds
          description: The 95th percentile of API request latency has exceeded two seconds for five minutes.

      - alert: OhPinSlowSupabaseRequests
        expr: |
          histogram_quantile(0.95,
            sum by (le, endpoint) (rate(ohpin_supabase_request_seconds_bucket{job="ohpin-be"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Supabase upstream p95 latency is above one second
          description: At least one Supabase endpoint has exceeded one second p95 latency for five minutes.
