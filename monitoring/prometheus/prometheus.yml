global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ohpin-be
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
        labels:
          service: ohpin-be
          environment: production

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: ohpin-be
          environment: production
